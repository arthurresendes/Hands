services:
  mongo:
    image: mongo:7
    container_name: hands-mongo
    restart: always
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: hands-backend
    restart: always
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: hands
      JWT_SECRET: ${JWT_SECRET}
      ENV: ${ENV:-dev}

volumes:
  mongo_data: